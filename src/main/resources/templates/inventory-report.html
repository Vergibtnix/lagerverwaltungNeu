<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lagerbericht - LAP Lagerverwaltung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <h1 class="h3 mb-3">Bericht: Aktueller Lagerbestand</h1>
    <div class="table-responsive">
        <table class="table table-striped bg-white">
            <thead>
            <tr>
                <th>Artikelnummer</th>
                <th>Artikelname</th>
                <th>Menge</th>
                <th>Gewichteter Einkaufspreis</th>
                <th>Gesamtwert</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${reportRows}">
                <td th:text="${row.product.articleNumber}"></td>
                <td th:text="${row.product.name}"></td>
                <td th:text="${row.quantity}"></td>
                <td th:text="${#numbers.formatDecimal(row.weightedPurchasePrice, 1, 2)} + ' EUR'"></td>
                <td th:text="${#numbers.formatDecimal(row.totalValue, 1, 2)} + ' EUR'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(reportRows)}">
                <td colspan="5" class="text-center">Keine Artikeldaten vorhanden.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
