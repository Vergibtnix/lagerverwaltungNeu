<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neues Produkt - LAP Lagerverwaltung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4">Neues Produkt anlegen</h1>
                    <form th:action="@{/products}" method="post" th:object="${productForm}" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">Produktname *</label>
                            <input class="form-control" type="text" th:field="*{name}" required maxlength="100">
                            <div class="text-danger small" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Beschreibung *</label>
                            <textarea class="form-control" rows="4" th:field="*{description}" required maxlength="5000"></textarea>
                            <div class="text-danger small" th:errors="*{description}"></div>
                        </div>

                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label">Kategorie *</label>
                                <select class="form-select" th:field="*{categoryId}" required>
                                    <option value="">Bitte waehlen</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{categoryId}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Verkaufspreis *</label>
                                <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{salePrice}" required>
                                <div class="text-danger small" th:errors="*{salePrice}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Einkaufspreis</label>
                                <input class="form-control" type="number" step="0.01" min="0" th:field="*{purchasePrice}">
                                <div class="text-danger small" th:errors="*{purchasePrice}"></div>
                            </div>
                        </div>

                        <div class="mb-3 mt-2">
                            <label class="form-label">Startbestand *</label>
                            <input class="form-control" type="number" th:field="*{stock}" required>
                            <div class="text-danger small" th:errors="*{stock}"></div>
                        </div>

                        <button class="btn btn-primary" type="submit">Produkt speichern</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Neue Kategorie</h2>
                    <form th:action="@{/categories}" method="post" th:object="${categoryForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label class="form-label">Kategoriename *</label>
                        <input class="form-control mb-2" type="text" th:field="*{name}" required maxlength="100">
                        <div class="text-danger small" th:errors="*{name}"></div>
                        <button class="btn btn-outline-primary" type="submit">Kategorie speichern</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
