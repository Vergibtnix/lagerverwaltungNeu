<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - LAP Lagerverwaltung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Produktliste</h1>
        <a class="btn btn-primary" th:href="@{/products/new}">Neues Produkt</a>
    </div>

    <form class="card card-body mb-4" method="get" th:action="@{/}" th:object="${filter}">
        <div class="row g-2">
            <div class="col-md-3">
                <label class="form-label">Name</label>
                <input class="form-control" type="text" th:field="*{name}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Kategorie</label>
                <select class="form-select" th:field="*{categoryId}">
                    <option value="">Alle</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Bestand min</label>
                <input class="form-control" type="number" th:field="*{stockMin}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Bestand max</label>
                <input class="form-control" type="number" th:field="*{stockMax}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Sortierung</label>
                <div class="input-group">
                    <select class="form-select" th:field="*{sortBy}">
                        <option value="name">Name</option>
                        <option value="category">Kategorie</option>
                        <option value="stock">Bestand</option>
                        <option value="price">Preis</option>
                    </select>
                    <select class="form-select" th:field="*{sortDir}">
                        <option value="asc">Aufsteigend</option>
                        <option value="desc">Absteigend</option>
                    </select>
                </div>
            </div>
            <div class="col-md-2">
                <label class="form-label">Preis min</label>
                <input class="form-control" type="number" step="0.01" min="0" th:field="*{priceMin}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Preis max</label>
                <input class="form-control" type="number" step="0.01" min="0" th:field="*{priceMax}">
            </div>
            <div class="col-md-2 d-grid align-self-end">
                <button class="btn btn-outline-primary" type="submit">Filter anwenden</button>
            </div>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover bg-white">
            <thead>
            <tr>
                <th>Name</th>
                <th>Kategorie</th>
                <th>Verkaufspreis</th>
                <th>Bestand</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.category.name}"></td>
                <td th:text="${#numbers.formatDecimal(product.salePrice, 1, 2)} + ' EUR'"></td>
                <td th:text="${product.stock}" th:classappend="${product.backorderRequired} ? 'status-negative' : ''"></td>
                <td>
                    <span th:if="${product.backorderRequired}" class="badge text-bg-danger badge-soft">nachzuliefern</span>
                    <span th:if="${!product.backorderRequired}" class="badge text-bg-success badge-soft">ok</span>
                </td>
                <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/products/{id}(id=${product.id})}">Details</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="text-center">Keine Produkte gefunden.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
