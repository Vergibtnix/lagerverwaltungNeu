<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmeldung - LAP Lagerverwaltung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <div class="card col-lg-5 mx-auto">
        <div class="card-body">
            <h1 class="h4 mb-3">Anmelden</h1>

            <div class="alert alert-success" th:if="${param.logout}">Erfolgreich abgemeldet.</div>
            <div class="alert alert-danger" th:if="${param.error}">Anmeldung fehlgeschlagen.</div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label" for="username">Benutzername</label>
                    <input id="username" name="username" class="form-control" type="text" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Passwort</label>
                    <input id="password" name="password" class="form-control" type="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Anmelden</button>
            </form>

            <p class="mt-3 mb-0 text-center">Noch kein Konto? <a th:href="@{/register}">Jetzt registrieren</a></p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
