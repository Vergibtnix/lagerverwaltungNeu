<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrierung - LAP Lagerverwaltung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <div class="card col-lg-6 mx-auto">
        <div class="card-body">
            <h1 class="h4 mb-3">Neues Benutzerkonto</h1>

            <form th:action="@{/register}" method="post" th:object="${registrationForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">Benutzername *</label>
                    <input class="form-control" type="text" th:field="*{username}" required minlength="3" maxlength="100">
                    <div class="text-danger small" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Passwort *</label>
                    <input class="form-control" type="password" th:field="*{password}" required minlength="8" maxlength="120">
                    <div class="text-danger small" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Passwort bestaetigen *</label>
                    <input class="form-control" type="password" th:field="*{passwordConfirm}" required>
                    <div class="text-danger small" th:errors="*{passwordConfirm}"></div>
                </div>
                <button class="btn btn-primary w-100" type="submit">Konto erstellen</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
