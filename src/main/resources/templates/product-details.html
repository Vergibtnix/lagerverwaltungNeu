<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name} + ' - Produktdetails'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <h1 class="h3 mb-3" th:text="${product.name}"></h1>
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Produkt bearbeiten</h2>
                    <form th:action="@{/products/{id}(id=${product.id})}" method="post" th:object="${productForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-2">
                            <label class="form-label">Produktname *</label>
                            <input class="form-control" type="text" th:field="*{name}" required maxlength="100">
                            <div class="text-danger small" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Beschreibung *</label>
                            <textarea class="form-control" rows="4" th:field="*{description}" required maxlength="5000"></textarea>
                            <div class="text-danger small" th:errors="*{description}"></div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label">Kategorie *</label>
                                <select class="form-select" th:field="*{categoryId}" required>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{categoryId}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Verkaufspreis *</label>
                                <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{salePrice}" required>
                                <div class="text-danger small" th:errors="*{salePrice}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Einkaufspreis</label>
                                <input class="form-control" type="number" step="0.01" min="0" th:field="*{purchasePrice}">
                                <div class="text-danger small" th:errors="*{purchasePrice}"></div>
                            </div>
                        </div>
                        <div class="mb-2 mt-2">
                            <label class="form-label">Lagerbestand *</label>
                            <input class="form-control" type="number" th:field="*{stock}" required>
                            <div class="text-danger small" th:errors="*{stock}"></div>
                        </div>
                        <button class="btn btn-primary" type="submit">Aenderungen speichern</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card mb-3 card-kpi">
                <div class="card-body">
                    <p class="mb-1"><strong>Kategorie:</strong> <span th:text="${product.category.name}"></span></p>
                    <p class="mb-1"><strong>Aktueller Bestand:</strong>
                        <span th:text="${product.stock}" th:classappend="${product.backorderRequired} ? 'status-negative' : ''"></span>
                    </p>
                    <p class="mb-0" th:if="${product.backorderRequired}">
                        <span class="badge text-bg-danger">nachzuliefern</span>
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Beschreibung</h2>
                    <p class="mb-0" th:text="${product.description}"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mt-1">
        <div class="col-lg-6">
            <h2 class="h5">Verkaeufe</h2>
            <div class="table-responsive">
                <table class="table table-sm bg-white">
                    <thead><tr><th>Datum</th><th>Menge</th><th>Kunde</th><th>Preis</th></tr></thead>
                    <tbody>
                    <tr th:each="sale : ${sales}">
                        <td th:text="${sale.saleDate}"></td>
                        <td th:text="${sale.quantity}"></td>
                        <td th:text="${sale.customerName ?: '-'}"></td>
                        <td th:text="${#numbers.formatDecimal(sale.unitPrice, 1, 2)} + ' EUR'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sales)}"><td colspan="4">Keine Verkaeufe.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-6">
            <h2 class="h5">Nachbestellungen</h2>
            <div class="table-responsive">
                <table class="table table-sm bg-white">
                    <thead><tr><th>Bestellt</th><th>Menge</th><th>Lieferant</th><th>Status</th></tr></thead>
                    <tbody>
                    <tr th:each="restock : ${restocks}">
                        <td th:text="${restock.orderedDate}"></td>
                        <td th:text="${restock.quantity}"></td>
                        <td th:text="${restock.supplier}"></td>
                        <td>
                            <span th:if="${restock.received}" class="badge text-bg-success">eingegangen</span>
                            <span th:if="${!restock.received}" class="badge text-bg-warning">offen</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(restocks)}"><td colspan="4">Keine Nachbestellungen.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
