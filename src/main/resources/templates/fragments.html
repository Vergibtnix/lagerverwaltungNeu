<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom mb-4" th:fragment="nav">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">LAP Lagerverwaltung</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products/new}">Neues Produkt</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/sales/new}">Verkauf erfassen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/restocks/new}">Nachbestellung erfassen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transactions}">Alle Transaktionen</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
</div>
</body>
</html>
