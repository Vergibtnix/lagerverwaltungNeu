<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom mb-4" th:fragment="nav">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">LAP Lagerverwaltung</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products/new}">Neues Produkt</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/sales/new}">Verkauf erfassen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/restocks/new}">Nachbestellung erfassen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transactions}">Alle Transaktionen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reports/inventory}">Lagerbericht</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <span class="small text-muted" sec:authorize="isAuthenticated()">
                    Angemeldet als <strong sec:authentication="name"></strong>
                </span>
                <a class="btn btn-sm btn-outline-primary" sec:authorize="isAnonymous()" th:href="@{/login}">Anmelden</a>
                <a class="btn btn-sm btn-primary" sec:authorize="isAnonymous()" th:href="@{/register}">Registrieren</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Abmelden</button>
                </form>
                <button id="themeToggle" class="btn btn-sm btn-outline-secondary" type="button">Dunkel</button>
            </div>
        </div>
    </div>
    <script th:src="@{/theme.js}"></script>
</nav>

<div class="container" th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
</div>
</body>
</html>
