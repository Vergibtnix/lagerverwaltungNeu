spring.application.name=lagerverwaltung

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:55432/lagerverwaltung
spring.datasource.username=lager_user
spring.datasource.password=lager_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false

spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start_only
