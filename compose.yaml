services:
  postgres:
    image: postgres:16
    container_name: lagerverwaltung-postgres
    environment:
      POSTGRES_DB: lagerverwaltung
      POSTGRES_USER: lager_user
      POSTGRES_PASSWORD: lager_pass
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lager_user -d lagerverwaltung" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
